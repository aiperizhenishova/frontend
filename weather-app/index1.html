<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    
    <div class="container">
        <div class="weather-container">

            <div class="temperature">
                <p>20</p>
            </div>

            <div class="time-location">
                <p>Tokmok</p>
                <span>14:05 - Friday 10.01.2026</span>
            </div>

            <div class="condition">
                <p>sunny</p>
            </div>

        </div>

        <nav>
            <form class="form">
                <input type="text" placeholder="type city" class="search-area">
                <button type="submit">search</button>
            </form>
        </nav>

    </div>
</body>

<script src="script.js"></script>
</html>
