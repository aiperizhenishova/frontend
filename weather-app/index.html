<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="weather-container">
            <div class="temperature">
                <p>31</p>
            </div>

            <div class="time-location">
                <p>Bishkek</p>
                <p>14:05 - Friday 09.01.2026</p>
            </div>

            <div class="condition">
                <p>Mist</p>
            </div>

        </div>

        <nav>
            <form>
                <input type="text" placeholder="search location" class="search-area">
                <button type="submit">search</button>
            </form>
        </nav>
    </div>


</body>
</html>
