<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbulb ON/OFF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bulb-container">
        <div class="wire"></div>
        <div class="wire-connection"></div>
        <div class="top-socket"></div>
        <div class="bottom-socket"></div>
        <div class="socket-back"></div>
        <div class="bulb-top"></div>
        <dib class="bulb-bottom"></dib>
    </div>


    <div class="switch-container">
        <div class="switch-cover">
            <div class="screw"></div>
            <div class="switch on"></div>
            <div class="screw"></div>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
